        text: Contenu greffé depuis le hub avec son histoire, workspace autonome vert en CI réelle, description dégelée.
        weight: 2
        status: accepted
        evidence:
          date: "2026-07-30"
          reference: "gate-acceptance-log 2026-07-30 (ligne 3.5), PR hub #286"
  - id: training-content
    title: Parcours d'entraînement complets
    exit_criteria:
      - id: training-content-done
        text: Des parcours d'entraînement sourcés couvrent le référentiel de pratique, parcours e2e verts.
